name: alexandria
description: "A decentralized, censorship-resistant digital library built with Flutter and IPFS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Storage & Offline Persistence
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # P2P Decentralized Storage & Transport
  dart_ipfs: ^1.3.4

  # Cryptography, Security & Enclave
  cryptography: ^2.7.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

  # File Ingestion, Media & Logging
  file_picker: ^8.1.7
  flutter_cache_manager: ^3.4.1
  sentry_flutter: ^8.13.0
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

dependency_overrides:
  meta: 1.16.0

flutter:
  uses-material-design: true
  generate: true
