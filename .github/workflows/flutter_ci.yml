name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          
      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Release builds: flutter build --dart-define=BUILD_COMMIT_SHA=${{ github.sha }}
      # (optional: --dart-define=BUILD_ARTIFACT_DIGEST=<digest> --dart-define=BUILD_TIMESTAMP=<iso8601>)
      # NOTE: BuildInfo provenance is self-declared "claimed_*" metadata with
      # zero trust weight (ALX-010) — never gate admission or rewards on it.
