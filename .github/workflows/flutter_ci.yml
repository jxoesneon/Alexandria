name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# (round-6 red finding) least-privilege token — the workflow only needs
# to read the checkout.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # (round-6 red finding) SHA-pinned: a tag is mutable and a
      # hijacked/moved tag would run arbitrary code in CI.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.4'
          
      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Release builds: flutter build --dart-define=BUILD_COMMIT_SHA=${{ github.sha }}
      # (optional: --dart-define=BUILD_ARTIFACT_DIGEST=<digest> --dart-define=BUILD_TIMESTAMP=<iso8601>)
      # NOTE: BuildInfo provenance is self-declared "claimed_*" metadata with
      # zero trust weight (ALX-010) — never gate admission or rewards on it.
