include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - 'lib/data/database.g.dart'
    # (round-10 red finding) The red-team PoC is contract-fixed and
    # must not be edited; its doc comment references `[plantOffset]`,
    # a name that isn't in scope (info-level `comment_references`
    # lint). Excluded from analysis only — the test still compiles and
    # runs normally.
    - 'test/redteam/round10_jpeg_payload_exif_channel_test.dart'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - unawaited_futures
    - sort_child_properties_last
    - prefer_single_quotes
    - avoid_empty_else
    - comment_references
    - no_duplicate_case_values
    - unnecessary_this
    - prefer_void_to_null
